<!doctype html>
<html><head><meta charset="utf-8"></head><body><h2>visibility/focus diag</h2>
<script>
function L(m){ console.log('VIS: ' + m); }
function snap(tag){
  L(tag + ' visibilityState=' + document.visibilityState +
    ' hidden=' + document.hidden +
    ' hasFocus=' + document.hasFocus() +
    ' wasDiscarded=' + document.wasDiscarded +
    ' prerendering=' + ('prerendering' in document ? document.prerendering : 'n/a'));
}
L('start');
snap('initial');
document.addEventListener('visibilitychange', function(){ snap('visibilitychange'); });
window.addEventListener('focus', function(){ L('window focus event'); snap('onfocus'); });
window.addEventListener('blur', function(){ L('window blur event'); snap('onblur'); });
// re-check after load + a few seconds (state can settle late)
window.addEventListener('load', function(){ snap('load'); });
var n=0; var iv=setInterval(function(){ n++; snap('tick'+n); if(n>=5) clearInterval(iv); }, 2000);
// rAF: does the compositor drive frames? (a hidden/occluded page may starve rAF)
var raf=0; function loop(){ raf++; if(raf<=3) L('rAF fired #' + raf); if(raf<120) requestAnimationFrame(loop); }
requestAnimationFrame(loop);
setTimeout(function(){ L('rAF total in ~8s = ' + raf); }, 8000);
</script></body></html>
