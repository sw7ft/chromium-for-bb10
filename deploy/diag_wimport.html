<!doctype html>
<html><head><meta charset="utf-8"></head><body><h2>worker importScripts diag</h2>
<script>
function L(m){ console.log('WIMP: ' + m); }
L('start');

// reCAPTCHA's BotGuard worker is created from a same-origin .js whose entire
// body is importScripts('https://www.gstatic.com/.../recaptcha__en.js'). So the
// thing that must work is: a dedicated Worker doing cross-origin importScripts.
var code =
  "self.onmessage=function(){};" +
  "try {" +
  "  importScripts('https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js');" +
  "  postMessage('IMPORT_OK jQuery=' + (typeof jQuery));" +
  "} catch(e) { postMessage('IMPORT_THREW ' + e); }";
try {
  var blob = new Blob([code], {type:'application/javascript'});
  var w = new Worker(URL.createObjectURL(blob));
  var done = false;
  var to = setTimeout(function(){ if(!done) L('WORKER importScripts TIMEOUT (10s) -- broken'); }, 10000);
  w.onmessage = function(e){ done = true; clearTimeout(to); L('worker said: ' + e.data); };
  w.onerror = function(e){ done = true; clearTimeout(to); L('worker ERROR: ' + (e.message||e) + ' @' + (e.filename||'') + ':' + (e.lineno||'')); };
  w.postMessage('go');
  L('worker created');
} catch(e){ L('Worker ctor THREW: ' + e); }
</script></body></html>
