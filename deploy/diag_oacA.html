<!doctype html>
<html><head><meta charset="utf-8"></head><body><h2>OAC length-only (44100, no nodes)</h2>
<script>
function step(n){ try { var x=new XMLHttpRequest(); x.open('GET','http://127.0.0.1:8850/step?'+n,false); x.send(); } catch(e){} }
step('A-start');
var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
var ctx = new OAC(1, 44100, 44100);
step('A-constructed');
setTimeout(function(){ step('A-alive-after-2s'); ctx.startRendering(); step('A-render-called'); }, 2000);
ctx.oncomplete = function(e){ step('A-oncomplete-' + e.renderedBuffer.length); };
</script></body></html>
