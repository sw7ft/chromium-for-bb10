<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="font-family:sans-serif">
<h2>MSE fMP4 diag</h2>
<video id="v" controls playsinline style="width:320px;height:240px;background:#000"></video>
<script>
function L(m){ console.log('MSE: ' + m); }
L('start');
if (!('MediaSource' in window)) { L('MediaSource missing'); throw 0; }
var mime = 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"';
L('isTypeSupported: ' + MediaSource.isTypeSupported(mime));
var ms = new MediaSource();
var v = document.getElementById('v');
v.src = URL.createObjectURL(ms);
ms.addEventListener('sourceopen', function(){
  L('sourceopen');
  var sb;
  try { sb = ms.addSourceBuffer(mime); } catch(e){ L('addSourceBuffer threw: ' + e); return; }
  sb.addEventListener('error', function(){ L('sb error'); });
  sb.addEventListener('updateend', function(){
    L('updateend rs=' + v.readyState + ' t=' + v.currentTime.toFixed(2));
    if (v.readyState >= 2 && v.paused) {
      v.play().then(function(){ L('play ok'); }).catch(function(e){ L('play fail ' + e); });
    }
  });
  fetch('https://www.w3schools.com/html/mov_bbb.mp4')
    .then(function(r){ L('fetch status=' + r.status); return r.arrayBuffer(); })
    .then(function(buf){
      L('append ' + buf.byteLength + ' bytes');
      sb.appendBuffer(buf);
    })
    .catch(function(e){ L('fetch fail ' + e); });
});
v.addEventListener('error', function(){
  if (v.error) L('video MEDIA_ERR code=' + v.error.code);
});
</script>
</body>
</html>
