<!doctype html>
<html><head><meta charset="utf-8"></head><body><h2>realtime AudioContext only</h2>
<script>
function L(m){ console.log('AC: ' + m); }
L('start');
try {
  var AC = window.AudioContext || window.webkitAudioContext;
  L('ctor present: ' + (!!AC));
  var ac = new AC();
  L('constructed state=' + ac.state + ' sr=' + ac.sampleRate);
} catch(e){ L('THREW ' + e); }
</script></body></html>
